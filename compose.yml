services:
  app:
    build:
      context: .
      target: development
    command: npm run dev:app
    ports:
      - "3001:3000"
    volumes:
      - .:/home/app
      - /home/app/node_modules
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${PORT}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - INSTANCE=server_1
      # --- AWS ENV VARS ---
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_BUCKET=${AWS_BUCKET}
      - PAYSTACK_SECRET_KEY=${PAYSTACK_SECRET_KEY}
      - AMQP_URL=${AMQP_URL}
    depends_on:
      postgres_db:
        condition: service_healthy
      redis_cache:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - bknd_network

  worker:
    build:
      context: .
      target: development
    container_name: worker
    command: npm run dev:worker
    restart: unless-stopped
    volumes:
      - .:/home/app:ro
      - /home/app/node_modules
    depends_on:
      postgres_db:
        condition: service_healthy
      redis_cache:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    environment:
      - AMQP_URL=${AMQP_URL}
    networks:
      - bknd_network

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app
      - pgadmin_ui
    networks:
      - bknd_network

  # --- POSTGRES DATABASE ---
  postgres_db:
    image: postgres:15-alpine
    container_name: postgres_db
    ports:
      - "5432:5432"
    environment:
      - PGTZ=${TZ:-UTC}
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=mydb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d mydb"]
      interval: 5s
      timeout: 3s
      retries: 3
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - bknd_network

  # --- POSTGRES GRAPHICAL INTERFACE ---
  pgadmin_ui:
    image: dpage/pgadmin4:9.15
    container_name: pgadmin_ui
    ports:
      - "8080:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=adminpassword
    depends_on:
      - postgres_db
    networks:
      - bknd_network

  # --- REDIS CACHE ---
  redis_cache:
    image: redis:7-alpine
    container_name: redis_cache
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - bknd_network
  ngrok:
    image: ngrok/ngrok:latest
    command:
      - "http"
      - "nginx:80" # Tells ngrok to tunnel straight to your api container on port 3000
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040" # Opens the local ngrok web dashboard
    depends_on:
      - app
    networks:
      - bknd_network

  # --- OBSERVABILITY / MONITORING STACK ---
  # loki:
  #   image: grafana/loki:3.0.0
  #   ports:
  #     - "3100:3100"
  #   command: -config.file=/etc/loki/local-config.yaml
