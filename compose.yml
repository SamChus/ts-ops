services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3000"
    volumes:
      - .:/home/app
      - /home/app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DB_HOST=postgres_db
      - DB_PORT=5432
      - DB_USER=admin
      - DB_PASSWORD=password
      - DB_NAME=mydb
      - REDIS_HOST=redis_cache
      - REDIS_PORT=6379
      - INSTANCE=server_1
      # --- AWS ENV VARS ---
      - AWS_ACCESS_KEY_ID=yourAccessKey
      - AWS_SECRET_ACCESS_KEY=yourSecretKey
      - AWS_REGION=yourRegion
      - AWS_BUCKET=yourBucketName
    depends_on:
      - postgres_db
      - redis_cache
    networks:
      - bknd_network

  nginx_balancer:
    image: nginx:alpine
    container_name: nginx_balancer
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app
      - pgadmin_ui
      - redis_commander_ui
    networks:
      - bknd_network

  # --- POSTGRES DATABASE ---
  postgres_db:
    image: postgres:15-alpine
    container_name: postgres_db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=mydb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - bknd_network

  # --- POSTGRES GRAPHICAL INTERFACE ---
  pgadmin_ui:
    image: dpage/pgadmin4:9.15
    container_name: pgadmin_ui
    ports:
      - "8080:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=adminpassword
    depends_on:
      - postgres_db
    networks:
      - bknd_network

  # --- REDIS CACHE ---
  redis_cache:
    image: redis:7-alpine
    container_name: redis_cache
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - bknd_network

  # --- REDIS GRAPHICAL INTERFACE ---
  redis_commander_ui:
    image: rediscommander/redis-commander:latest
    container_name: redis_commander_ui
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis_cache:6379
    depends_on:
      - redis_cache
    networks:
      - bknd_network

  # --- OBSERVABILITY / MONITORING STACK ---
  loki:
    image: grafana/loki:3.0.0
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - bknd_network # Network fixed

  promtail:
    image: grafana/promtail:3.0.0
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki # Ensured loki starts first
    networks:
      - bknd_network # Network fixed

  grafana:
    image: grafana/grafana:11.0.0
    ports:
      - "4000:3000" # UI access stays on localhost:4000
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - loki
    networks:
      - bknd_network # Network fixed

networks:
  bknd_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
